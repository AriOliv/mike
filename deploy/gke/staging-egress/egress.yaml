# Default-deny egress, then only:
#   - DNS: NodeLocal DNSCache (169.254.20.10, what pods' resolv.conf points at)
#     and kube-dns itself (its ClusterIP and its pods, for the fallback path);
#   - pods of this namespace;
#   - the Avenia LiteLLM gateway (proxy.avenia.tech, 34.144.247.211) on 443.
# Nothing else leaves the namespace: no GitHub, no public internet. A new
# external dependency is added here on purpose, never by opening the default.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
spec:
  podSelector: {}
  policyTypes: [Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-dns
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock: { cidr: 169.254.20.10/32 }
        - ipBlock: { cidr: 34.118.224.10/32 }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { k8s-app: kube-dns } }
      ports:
        - { port: 53, protocol: UDP }
        - { port: 53, protocol: TCP }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-same-namespace
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to: [{ podSelector: {} }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-litellm
spec:
  podSelector: { matchLabels: { app: backend } }
  policyTypes: [Egress]
  egress:
    - to: [{ ipBlock: { cidr: 34.144.247.211/32 } }]
      ports: [{ port: 443, protocol: TCP }]
