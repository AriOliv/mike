# Next.js frontend. The only Service behind the load balancer: it serves the
# app and proxies /api/* to the backend (frontend/src/app/api/[...path]).
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  selector: { app: frontend }
  ports: [{ name: http, port: 3000, targetPort: 3000 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 1
  selector: { matchLabels: { app: frontend } }
  template:
    metadata: { labels: { app: frontend } }
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: mike-frontend
          ports: [{ containerPort: 3000 }]
          env:
            - { name: API_BASE_URL, value: "http://backend:3001" }
            - { name: SENTRY_DISABLED, value: "true" }
          readinessProbe:
            httpGet: { path: /login, port: 3000 }
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 1Gi }
