# Default-deny ingress for the namespace (Avenia privatization policy), then:
#   - pods may talk to each other inside the namespace;
#   - only the frontend accepts traffic from Google's L7 LB proxies / health
#     checkers (35.191.0.0/16, 130.211.0.0/22).
# Egress: open in the preview (fictitious); staging adds a default-deny egress
# allowlist (../staging-egress: DNS, the namespace, the LiteLLM gateway).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-same-namespace
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from: [{ podSelector: {} }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gclb-to-frontend
spec:
  podSelector: { matchLabels: { app: frontend } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: { cidr: 35.191.0.0/16 }
        - ipBlock: { cidr: 130.211.0.0/22 }
      ports: [{ port: 3000, protocol: TCP }]
