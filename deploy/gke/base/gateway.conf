# Supabase gateway for GKE: same routing as supabase/gateway.conf, but upstreams
# are cluster Services (stable ClusterIPs, resolved once at start) and nginx runs
# unprivileged on 8080. Only the backend and the seed job reach it; it is never
# exposed through the load balancer.
server {
    listen 8080;
    server_name _;
    client_max_body_size 50m;

    location /auth/v1/ {
        rewrite ^/auth/v1/(.*)$ /$1 break;
        proxy_pass http://auth:9999;
    }

    location /rest/v1/ {
        rewrite ^/rest/v1/(.*)$ /$1 break;
        proxy_pass http://rest:3000;
    }
}
