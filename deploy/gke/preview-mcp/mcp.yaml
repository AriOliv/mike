# A Service of its own so the LB builds a separate backend service for it, one
# with no IAP policy; the frontend's (frontend-iap) is untouched. Same pods as
# the backend Service.
apiVersion: v1
kind: Service
metadata:
  name: backend-mcp
spec:
  selector: { app: backend }
  ports: [{ name: http, port: 3001, targetPort: 3001 }]
---
# Only the MCP paths: everything else on the host (including /api/* and the
# consent screen /oauth/consentir, which needs the normal login) still goes to
# the frontend behind IAP. These matches beat the catch-all route.
#   /mcp                                          the MCP server (Phase 1)
#   /.well-known/oauth-protected-resource[/...]   metadata MCP clients discover
#   /.well-known/oauth-authorization-server[/...] (RFC 9728 / RFC 8414)
#   /oauth/{register,authorize,token,revoke}      the authorization server (Phase 2)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp
spec:
  parentRefs: [{ name: mike-edge, sectionName: https }]
  rules:
    - matches:
        - path: { type: Exact, value: /mcp }
        - path: { type: PathPrefix, value: /.well-known/oauth-protected-resource }
        - path: { type: PathPrefix, value: /.well-known/oauth-authorization-server }
        - path: { type: Exact, value: /oauth/register }
        - path: { type: Exact, value: /oauth/authorize }
        - path: { type: Exact, value: /oauth/token }
        - path: { type: Exact, value: /oauth/revoke }
      backendRefs: [{ name: backend-mcp, port: 3001 }]
---
# No iap block: this backend service is public, the token is checked in Mike.
# The LB streams responses (no buffering); 300 s like the frontend's.
apiVersion: networking.gke.io/v1
kind: GCPBackendPolicy
metadata:
  name: backend-mcp
spec:
  targetRef: { group: "", kind: Service, name: backend-mcp }
  default:
    timeoutSec: 300
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: backend-mcp-hc
spec:
  targetRef: { group: "", kind: Service, name: backend-mcp }
  default:
    config:
      type: HTTP
      httpHealthCheck: { requestPath: /health, port: 3001 }
---
# The base policy admits the LB to the frontend only; this lets it reach the
# backend port too (proxies and health checkers, as in networkpolicy.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gclb-to-backend-mcp
spec:
  podSelector: { matchLabels: { app: backend } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - ipBlock: { cidr: 35.191.0.0/16 }
        - ipBlock: { cidr: 130.211.0.0/22 }
      ports: [{ port: 3001, protocol: TCP }]
