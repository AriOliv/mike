# GitHub Actions workflow: automatically creates a PR when an issue is opened.
# The tool is vendored under tools/pr-reviewer/; data lives in .pr-reviewer/.
name: issue-to-pr

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  auto-pr:
    # Fires on every opened issue. To make it opt-in instead, change this to:
    #   if: ${{ github.event.label.name == 'auto-pr' }}
    # and add the `auto-pr` label to the issues you want auto-fixed.
    if: ${{ github.event.action == 'opened' || github.event.label.name == 'auto-pr' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --no-cache-dir -r tools/pr-reviewer/requirements.txt

      - name: Generate PR from Issue
        run: python tools/pr-reviewer/issue_to_pr.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_MODEL: "gemini-3.6-flash"
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
