# Testes das guardas do auto-fix (.github/auto-fix). São a peça que decide o que o
# agente pode mudar; se elas quebram em silêncio, o PR automático perde a trava.
# Node puro, sem dependências.
name: Auto-fix guards

on:
  pull_request:
    paths:
      - ".github/auto-fix/**"
      - ".github/workflows/auto-fix.yml"
      - ".github/workflows/auto-fix-guard.yml"
  push:
    branches: [main]
    paths:
      - ".github/auto-fix/**"
      - ".github/workflows/auto-fix.yml"

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - run: node --test ".github/auto-fix/test/*.test.mjs"
