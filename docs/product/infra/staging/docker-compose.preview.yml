# RASCUNHO — stack de prévia/staging na VM mike-staging. Não executado.
#
# Mesma topologia de prod (deploy/docker-compose.vm.yml) com 3 diferenças:
#   1. Nenhuma porta publicada: o acesso é só pela rede docker "edge" (Caddy de
#      prévias), que fica atrás do Cloudflare Tunnel.
#   2. COMPOSE_PROJECT_NAME = mike-pr-<n> | mike-staging. Os volumes viram
#      mike-pr-<n>_db_data etc. — nunca colidem com mike_db_data/mike_storage_data
#      (que, de qualquer forma, só existem na VM de prod).
#   3. Segredos próprios de prévia (.env.shared + .env.<projeto>), nunca os de prod.
#
# Variáveis: BACKEND_IMAGE, FRONTEND_IMAGE, HOST, BUILD_SHA, ENV_LABEL,
# JWT_SECRET_PREVIEW, CUSTOM_OPENAI_API_KEY_PREVIEW, ... (ver preview-up.sh).

services:
  db:
    image: supabase/postgres:17.6.1.136
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:?}
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET_PREVIEW:?}
      JWT_EXP: 3600
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./schema:/schema:ro          # schema.sql + migrations + seed, copiados pelo preview-up
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 1g
    restart: unless-stopped

  auth:
    image: supabase/gotrue:v2.189.0
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: "9999"
      API_EXTERNAL_URL: https://${HOST}/supabase
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${DB_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: https://${HOST}
      GOTRUE_URI_ALLOW_LIST: https://${HOST}/**
      GOTRUE_JWT_SECRET: ${JWT_SECRET_PREVIEW:?}
      GOTRUE_JWT_EXP: "3600"
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      # Prévia: só as contas seed (senha). Staging: Google SSO com client próprio.
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-true}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID_STAGING:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_OAUTH_SECRET_STAGING:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: https://${HOST}/supabase/auth/v1/callback
    depends_on:
      db: { condition: service_healthy }
    mem_limit: 256m
    restart: unless-stopped

  rest:
    image: postgrest/postgrest:v14.12
    environment:
      PGRST_DB_URI: postgres://authenticator:${DB_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET_PREVIEW:?}
    depends_on:
      db: { condition: service_healthy }
    mem_limit: 128m
    restart: unless-stopped

  gateway:
    image: nginx:alpine
    volumes:
      - ./gateway.conf:/etc/nginx/conf.d/default.conf:ro   # cópia de supabase/gateway.conf
    depends_on: [auth, rest]
    networks: [default, edge]
    mem_limit: 64m
    restart: unless-stopped

  storage:
    image: rustfs/rustfs:latest
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?}
      RUSTFS_SECRET_KEY: ${STORAGE_SECRET_KEY:?}
    volumes:
      - storage_data:/data
    mem_limit: 256m
    restart: unless-stopped

  backend:
    image: ${BACKEND_IMAGE:?}
    env_file: [./backend.env]          # gerado pelo preview-up a partir de .env.shared
    environment:
      APP_ENV: ${ENV_LABEL}
      BUILD_SHA: ${BUILD_SHA}
      FEEDBACK_ENABLED: "true"
      # Sem sincronizadores externos em prévia: nada escreve no Notion/Drive/Calendar reais.
      NOTION_TOKEN: ""
      DRIVE_FOLDER_ID: ""
      GOOGLE_CALENDAR_ID: ""
    depends_on:
      db: { condition: service_healthy }
      storage: { condition: service_started }
    networks: [default, edge]
    mem_limit: 1g
    restart: unless-stopped

  worker:
    # Worker de agentes (fila Postgres). Mesmo binário, outro modo.
    image: ${BACKEND_IMAGE:?}
    env_file: [./backend.env]
    environment:
      WORKERS_MODE: agents
      APP_ENV: ${ENV_LABEL}
      NOTION_TOKEN: ""
      DRIVE_FOLDER_ID: ""
      GOOGLE_CALENDAR_ID: ""
      SLACK_NOTIFY_DRY_RUN: "true"     # prévia nunca posta no Slack real
    depends_on:
      db: { condition: service_healthy }
    mem_limit: 512m
    restart: unless-stopped
    profiles: [agents]                 # liga quando o worker existir no código

  frontend:
    image: ${FRONTEND_IMAGE:?}
    depends_on: [backend]
    networks: [default, edge]
    mem_limit: 512m
    restart: unless-stopped

networks:
  edge:
    external: true                     # criada uma vez: docker network create mike-edge
    name: mike-edge

volumes:
  db_data:
  storage_data:
