# RASCUNHO — trecho para hermes-gcp-deploy/docbot/config.yaml (PR naquele repo,
# não aqui). Não aplicado. Segue o formato dos outros bots (adabuddy/config.yaml).
#
# Ordem de rollout: primeiro apontar para STAGING (mike_staging) com o token de
# staging; só depois do teste com o Legal trocar para prod.
#
# MIKE_MCP_TOKEN: token de serviço do bot "docbot" criado no Mike
# (mcp_service_tokens, escopos intake:write, requests:read:own, deadlines:read,
# kb:ask). Vai no .env do profile, nunca no repo.
mcp_servers:
  mike:
    url: https://staging.clm.avenia.tech/api/mcp      # prod: https://clm.avenia.tech/api/mcp
    auth: header
    headers:
      Authorization: Bearer ${MIKE_MCP_TOKEN}
      # Staging/prévia ficam atrás do Cloudflare Access: o bot usa um service token
      # do Access só para o host de staging. Prod não precisa destes dois headers.
      CF-Access-Client-Id: ${MIKE_CF_ACCESS_CLIENT_ID}
      CF-Access-Client-Secret: ${MIKE_CF_ACCESS_CLIENT_SECRET}
    tools:
      resources: false
      prompts: false
      include:
        - mike_request_analysis
        - mike_get_request_status
        - mike_list_my_requests
        - mike_add_request_info
        - mike_ask_knowledge_base
        - mike_upcoming_deadlines

# Adição sugerida ao docbot/SOUL.md (comportamento):
