<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mike Legal protótipo</title>
<style>
:root{
  --paper:#F5F0E6; --paper-2:#FBF8F1; --paper-3:#EFE9DB; --card:#FFFFFF;
  --ink:#121212; --ink-soft:#3B3A36; --muted:#8B887D; --muted-2:#B6B2A6;
  --violet:#6E5BF2; --violet-deep:#4B38C9; --violet-soft:#E7E3FD;
  --lime:#E4F06A; --ok:#3FA56A; --ok-soft:#E3F3E9; --warn:#C98E22; --warn-soft:#FBF0D9;
  --err:#D5604C; --err-soft:#FBE5E0;
  --line:rgba(18,18,18,.10); --line-strong:rgba(18,18,18,.22);
  --shadow:0 2px 8px rgba(18,18,18,.05),0 8px 24px rgba(18,18,18,.05);
  --r-sm:8px; --r-md:12px; --r-lg:18px;
  --sans:'Geist',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  --mono:'Geist Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#161614; --paper-2:#1D1D1B; --paper-3:#262623; --card:#1F1F1D;
  --ink:#F1ECE0; --ink-soft:#D6D1C4; --muted:#9A968A; --muted-2:#6B685F;
  --violet:#8B7DF5; --violet-deep:#B3A8FA; --violet-soft:#2C2650;
  --ok-soft:#1E3326; --warn-soft:#3A2E14; --err-soft:#3D221D;
  --line:rgba(241,236,224,.10); --line-strong:rgba(241,236,224,.22);
  --shadow:0 2px 8px rgba(0,0,0,.3);
}}
:root[data-theme="dark"]{
  --paper:#161614; --paper-2:#1D1D1B; --paper-3:#262623; --card:#1F1F1D;
  --ink:#F1ECE0; --ink-soft:#D6D1C4; --muted:#9A968A; --muted-2:#6B685F;
  --violet:#8B7DF5; --violet-deep:#B3A8FA; --violet-soft:#2C2650;
  --ok-soft:#1E3326; --warn-soft:#3A2E14; --err-soft:#3D221D;
  --line:rgba(241,236,224,.10); --line-strong:rgba(241,236,224,.22);
  --shadow:0 2px 8px rgba(0,0,0,.3);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.45 var(--sans)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--violet-deep)}
.mono{font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
/* layout */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--paper-2);border-bottom:1px solid var(--line)}
.brand{font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand i{display:inline-block;width:18px;height:18px;border-radius:5px;background:var(--violet)}
nav.main{display:flex;gap:2px;overflow-x:auto}
nav.main a{padding:7px 12px;border-radius:999px;text-decoration:none;color:var(--ink-soft);white-space:nowrap}
nav.main a.on{background:var(--ink);color:var(--paper)}
nav.main a .n{font-family:var(--mono);font-size:11px;margin-left:4px;opacity:.7}
.spacer{flex:1}
.persona{display:flex;align-items:center;gap:6px;white-space:nowrap}
.persona select{padding:5px 8px;border-radius:999px;border:1px solid var(--line-strong);background:var(--card)}
.ask-btn{padding:6px 12px;border-radius:999px;border:1px solid var(--violet);background:var(--violet-soft);color:var(--violet-deep);cursor:pointer;white-space:nowrap}
main{max-width:1320px;margin:0 auto;padding:24px 20px 80px}
h1{font-size:26px;letter-spacing:-.02em;margin:0 0 4px}
h2{font-size:15px;margin:0}
.sub{color:var(--muted);margin:0 0 20px}
.grid{display:grid;gap:16px}
.g-home{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
.grid>*{min-width:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:16px 18px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}
.briefing{background:var(--ink);color:var(--paper);border-radius:var(--r-lg);padding:18px 20px;margin-bottom:16px}
.briefing .mono{color:var(--muted-2)}
.briefing p{margin:6px 0 0;font-size:16px;max-width:80ch}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:600}
.row .s{color:var(--muted);font-size:12.5px}
.clickable{cursor:pointer}
.clickable:hover .t{color:var(--violet-deep)}
.btn{padding:6px 11px;border-radius:999px;border:1px solid var(--line-strong);background:var(--card);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.vio{background:var(--violet);color:#fff;border-color:var(--violet)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent}
.pill{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;background:var(--paper-3);color:var(--ink-soft);white-space:nowrap}
.pill.red{background:var(--err-soft);color:var(--err)} .pill.amb{background:var(--warn-soft);color:var(--warn)}
.pill.grn{background:var(--ok-soft);color:var(--ok)} .pill.vio{background:var(--violet-soft);color:var(--violet-deep)}
.dbadge{font-family:var(--mono);font-size:12px;font-weight:600;padding:3px 7px;border-radius:6px;min-width:52px;text-align:center}
.d30{background:var(--err);color:#fff}.d60{background:var(--warn);color:#fff}.d90{background:var(--paper-3);color:var(--ink-soft)}.dpast{background:var(--ink);color:var(--paper)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px}
.kpi b{display:block;font-size:24px;letter-spacing:-.02em}
.bar{height:6px;border-radius:99px;background:var(--paper-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}
.bar.warn i{background:var(--warn)} .bar.err i{background:var(--err)}
/* table */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{border:1px solid var(--line);background:transparent;padding:5px 11px;border-radius:999px;cursor:pointer;color:var(--ink-soft)}
.tabs button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.search{flex:1;min-width:240px;display:flex;align-items:center;gap:6px;border:1px solid var(--line-strong);border-radius:999px;padding:6px 12px;background:var(--card)}
.search input{border:0;outline:0;background:transparent;flex:1;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 6px 3px 10px;border-radius:999px;background:var(--violet-soft);color:var(--violet-deep);font-size:12.5px}
.chip button{border:0;background:transparent;cursor:pointer;color:inherit;padding:0 4px}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r-md);background:var(--card);max-height:68vh}
table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;font-size:13px}
thead th{position:sticky;top:0;background:var(--paper-2);z-index:2;font-weight:600}
thead tr.grp th{top:0;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;border-bottom:0}
thead tr.cols th{top:28px}
th.sticky,td.sticky{position:sticky;left:0;background:var(--card);z-index:1;border-right:1px solid var(--line)}
thead th.sticky{z-index:3;background:var(--paper-2)}
tbody tr:hover td{background:var(--paper-2)}
td.unv{text-decoration:underline dotted var(--violet);text-underline-offset:3px}
td.edit input{width:130px;padding:2px 4px}
td .lnk{font-weight:600;cursor:pointer}
td .lnk:hover{color:var(--violet-deep)}
/* contract page */
.cp-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.cp-head h1{margin:0}
.cp{display:grid;grid-template-columns:58fr 42fr;gap:16px;align-items:start}
.doc{position:relative;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:28px 34px;height:74vh;overflow:auto;font-family:Georgia,'Times New Roman',serif;font-size:14.5px;line-height:1.65}
.doc h3{font-family:var(--sans);font-size:13px;letter-spacing:.04em;text-transform:uppercase;margin:22px 0 6px;color:var(--ink-soft)}
.doc p{margin:0 0 8px}
.doc mark{background:var(--lime);color:#121212;border-radius:3px;padding:0 2px;box-shadow:0 0 0 3px var(--lime)}
.side{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);height:74vh;display:flex;flex-direction:column;overflow:hidden}
.side .tabs{padding:12px 14px 0;margin:0}
.side-body{overflow:auto;padding:8px 14px 16px;flex:1}
.fgrp{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 4px}
.field{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:7px 8px;border-radius:8px;cursor:pointer;border:1px solid transparent}
.field:hover{background:var(--paper-2)}
.field.sel{border-color:var(--violet);background:var(--violet-soft)}
.field .lbl{color:var(--muted);font-size:12.5px}
.field .val{font-weight:600;grid-column:1}
.field .prov{grid-column:2;grid-row:1/3;display:flex;flex-direction:column;align-items:flex-end;gap:4px;justify-content:center}
.prov-ia{color:var(--violet-deep);font-size:11.5px}
.prov-ok{color:var(--ok);font-size:11.5px}
.prov-ed{color:var(--warn);font-size:11.5px}
.field .acts{display:none;gap:4px}
.field:hover .acts,.field.sel .acts{display:flex}
.field input{width:100%;padding:3px 6px;border:1px solid var(--violet);border-radius:6px;background:var(--card)}
.progress{position:sticky;top:0;background:var(--card);padding:10px 0 8px;z-index:1;border-bottom:1px solid var(--line)}
.risk{border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:10px;padding:10px 12px;margin:10px 0}
.risk.alto{border-left-color:var(--err)} .risk.fav{border-left-color:var(--ok)}
.risk .sug{background:var(--paper-2);border-radius:8px;padding:8px 10px;margin-top:6px;font-size:13px}
.act{display:flex;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.act .av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--paper-3);flex:none}
.act.cm .bubble{background:var(--paper-2);border-radius:10px;padding:6px 10px}
.mention{color:var(--violet-deep);font-weight:600}
textarea{width:100%;border:1px solid var(--line-strong);border-radius:10px;padding:8px 10px;background:var(--card);resize:vertical}
/* inbox */
.inbox{display:grid;grid-template-columns:1fr;gap:16px}
.inbox.open{grid-template-columns:1.25fr 1fr}
.kanban{display:grid;grid-template-columns:repeat(5,minmax(200px,1fr));gap:10px;overflow-x:auto}
.lane{background:var(--paper-3);border-radius:var(--r-md);padding:10px;min-height:200px}
.kcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-top:8px;cursor:pointer}
.panel{position:sticky;top:70px}
.stepper{display:flex;gap:4px;margin:8px 0}
.stepper div{flex:1;text-align:center;font-size:11.5px;padding:6px 2px;border-radius:6px;background:var(--paper-3);color:var(--muted)}
.stepper div.done{background:var(--ok-soft);color:var(--ok)}
.stepper div.cur{background:var(--ink);color:var(--paper)}
/* drawer + modal */
.scrim{position:fixed;inset:0;background:rgba(18,18,18,.35);z-index:40;display:none}
.scrim.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--paper-2);z-index:41;transform:translateX(100%);transition:transform .25s cubic-bezier(.22,1,.36,1);display:flex;flex-direction:column;border-left:1px solid var(--line)}
.drawer.on{transform:none}
.drawer-h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.drawer-b{flex:1;overflow:auto;padding:14px 18px}
.drawer-f{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px}
.drawer-f input{flex:1;border:1px solid var(--line-strong);border-radius:999px;padding:8px 14px;background:var(--card)}
.msg-q{background:var(--ink);color:var(--paper);border-radius:14px 14px 4px 14px;padding:8px 12px;margin:10px 0 10px auto;max-width:85%;width:fit-content}
.msg-a{background:var(--card);border:1px solid var(--line);border-radius:14px 14px 14px 4px;padding:10px 12px;margin:10px 0}
.src{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:8px;background:var(--paper-2);margin-top:6px;font-size:12.5px;cursor:pointer}
.src:hover{background:var(--violet-soft)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));max-height:90vh;overflow:auto;background:var(--paper-2);border-radius:var(--r-lg);z-index:42;padding:22px;display:none;box-shadow:0 24px 60px rgba(0,0,0,.25)}
.modal.on{display:block}
.opt{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 14px}
.opt button{border:1px solid var(--line-strong);background:var(--card);padding:6px 12px;border-radius:999px;cursor:pointer}
.opt button.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.in{width:100%;border:1px solid var(--line-strong);border-radius:10px;padding:8px 10px;background:var(--card);margin:6px 0 14px}
label.mono{display:block}
.ai-box{background:var(--violet-soft);border-radius:12px;padding:10px 12px;font-size:13px;margin-bottom:14px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1}
.cta{display:flex;align-items:center;justify-content:space-between;gap:16px;background:var(--lime);color:#121212;border-radius:var(--r-lg);padding:22px 24px;margin-bottom:16px}
.cta h2{font-size:20px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal div{min-width:0;min-height:64px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:4px 6px;font-size:11.5px}
.cal .ev{display:block;margin-top:3px;border-radius:4px;padding:1px 4px;background:var(--err);color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .ev.rec{background:transparent;border:1px solid var(--violet);color:var(--violet-deep)}
.cal .dim{opacity:.4}
.empty{color:var(--muted);padding:12px 0}
@media (max-width:900px){
  .g-home,.cp,.inbox.open{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .doc,.side{height:auto;max-height:70vh}
  .top{flex-wrap:wrap;padding:10px 16px}
  main{padding:16px 16px 80px}
  .persona span{display:none}
  .row{flex-wrap:wrap}
  .row .grow{flex-basis:60%}
  .kpi b{font-size:20px}
}
</style>
<style>
/* ===== Paridade (docs/product/05 (paridade) §4): vocabulário visual compartilhado ===== */
:root{ --info:#2F6FDB; --info-soft:#E4ECFB; }
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){ --info:#8FB2F7; --info-soft:#1B2A45; }}
:root[data-theme="dark"]{ --info:#8FB2F7; --info-soft:#1B2A45; }
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slidein{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
svg.i{flex:none;vertical-align:-2px}
.muted{color:var(--muted)}
.linkbtn{border:0;background:transparent;padding:0;color:var(--violet-deep);cursor:pointer;font-size:12px}
.kbd{font-family:var(--mono);font-size:10px;padding:0 4px;border:1px solid var(--line-strong);border-radius:4px;margin-left:5px;color:var(--muted);text-transform:none}
/* StatusChip */
.sc{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap;background:var(--paper-3);color:var(--ink-soft)}
.sc i{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.sc.pronto{background:var(--paper-3);color:var(--ink)} .sc.pronto i{background:var(--info)}
.sc.rodando{background:var(--info-soft);color:var(--info)}
.sc.rodando i{width:9px;height:9px;background:transparent;border:1.5px solid currentColor;border-right-color:transparent;animation:spin .9s linear infinite}
.sc.bloqueado{background:var(--err-soft);color:var(--err)} .sc.bloqueado i{border-radius:1px}
.sc.concluido{background:transparent;color:var(--muted);padding-left:0} .sc.concluido i{display:none}
.sc.a_fazer{background:transparent;border:1px solid var(--line-strong);color:var(--ink-soft)} .sc.a_fazer i{background:transparent;border:1.5px solid currentColor;width:7px;height:7px}
@media (prefers-reduced-motion:reduce){.sc.rodando i{animation:none}}
/* VerdictCounts / VerdictLabel */
.vc{display:inline-flex;gap:10px;font-family:var(--mono);font-size:12.5px;white-space:nowrap}
.vc span{display:inline-flex;gap:3px;align-items:center}
.vc .a{color:var(--ok)} .vc .p{color:var(--warn)} .vc .d{color:var(--err)} .vc .z{color:var(--muted-2)}
.vt{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:4px 0 10px}
.vt button{text-align:left;border:1px solid var(--line);background:var(--paper-2);border-radius:12px;padding:8px 10px;cursor:pointer}
.vt button b{display:block;font-size:22px;letter-spacing:-.02em;color:var(--ink)}
.vt button span{display:inline-flex;gap:4px;align-items:center;font-size:12.5px}
.vt .a span{color:var(--ok)} .vt .p span{color:var(--warn)} .vt .d span{color:var(--err)}
.vt button.on{border-color:var(--ink);background:var(--card)}
.vl{display:inline-flex;gap:4px;align-items:center;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.vl.d{background:var(--err-soft);color:var(--err)} .vl.p{background:var(--warn-soft);color:var(--warn)} .vl.a{background:var(--ok-soft);color:var(--ok)} .vl.n{background:var(--paper-3);color:var(--muted)}
/* StatTiles */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.tile{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;cursor:pointer;min-width:0}
.tile:hover{border-color:var(--line-strong)}
.tile b{display:block;font-size:26px;letter-spacing:-.02em;line-height:1.15}
.tile .lbl{color:var(--muted);font-size:12.5px}
.tile.on{border-color:var(--ink);background:var(--paper-2)}
.tile.static{cursor:default}
.tile b.err{color:var(--err)} .tile b.warn{color:var(--warn)}
/* Saudação */
.greet{display:flex;align-items:center;gap:10px;font-size:18px;letter-spacing:-.01em;margin:2px 0 14px;flex-wrap:wrap}
.greet .ag-av{width:22px;height:22px}
.greet ul{flex-basis:100%;margin:2px 0 0 32px;padding:0;font-size:14px;color:var(--ink-soft)}
.greet ul li{margin:3px 0}
/* ReviewTable */
.rt{border:1px solid var(--line);border-radius:var(--r-md);background:var(--card);overflow-x:auto}
.rt-in{min-width:880px}
.rt-row{display:grid;align-items:center;gap:12px;padding:0 14px;min-height:52px;border-top:1px solid var(--line);cursor:pointer}
.rt-row:hover{background:var(--paper-2)}
.rt-row.sel{background:var(--violet-soft)}
.rt-row.foc{box-shadow:inset 3px 0 0 var(--violet)}
.rt-head{min-height:34px;border-top:0;background:var(--paper-2);cursor:default;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.rt-head:hover{background:var(--paper-2)}
.rt-row .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt-row .s{color:var(--muted);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt-row>*{min-width:0}
.rt-rev{grid-template-columns:minmax(240px,2.4fr) 150px 170px 70px 90px 170px}
.rt-ped{grid-template-columns:86px minmax(220px,2.2fr) 150px 130px 120px 96px 180px}

function exigeVoce(){
  const out=[];
  C.forEach(c=>{ const n=days(noticeDeadline(c)); const v=days(parseBR(c.vencimento)); if(n<=45 && v>=0 && c.renovAuto==='Sim') out.push({k:'renov-'+c.id,ord:n,html:`${dBadge(n)}<div class="grow"><div class="t">Decidir renovação · ${esc(c.contraparte)}</div><div class="s">${n<0?`<b>A janela de aviso passou.</b> Renova sozinho em ${esc(c.vencimento)}; dá para renegociar.`:`Renova sozinho em ${esc(c.vencimento)}. O aviso de ${esc(c.aviso)} precisa sair até ${fmt(noticeDeadline(c))}.`} ${esc(c.valor)}.</div></div>${renewBtns('renov-'+c.id,n<0)}`,go:'#/card/'+c.id}); });
  R.filter(r=>!r.resp && openCard(r)).forEach(r=>out.push({k:'atr-'+r.id,ord:5,html:`<span class="pill vio">${LANE[r.etapa]}</span><div class="grow"><div class="t">Atribuir: ${esc(r.titulo)}</div><div class="s">${esc(r.sol)} · ${esc(r.areaSol)} · via ${esc(r.canal)} · SLA ${slaInfo(r).txt}</div></div><button class="btn sm" data-act="atribuir" data-k="atr-${r.id}" data-r="${r.id}">Atribuir a Duda</button>`,go:'#/card/'+r.id}));
  R.filter(r=>r.prog==='Bloqueado').forEach(r=>out.push({k:'blk-'+r.id,ord:8,html:`<span class="pill red">bloqueado</span><div class="grow"><div class="t">${esc(r.titulo)}</div><div class="s">${esc(r.bloqueio||'')} · com ${esc(r.resp)}</div></div><button class="btn sm">abrir</button>`,go:'#/card/'+r.id}));
  C.filter(c=>c.risco==='alto').forEach(c=>out.push({k:'risk-'+c.id,ord:20,html:`<span class="pill red">risco alto</span><div class="grow"><div class="t">Revisar risco · ${esc(c.contraparte)}</div><div class="s">${SCHEMA.length-validCount(c)} campos a conferir, ${c.controle==='Sim'?'mudança de controle com penalidade: '+esc(c.controlePen.toLowerCase()):'cláusulas fora do playbook'}.</div></div><button class="btn sm">abrir</button>`,go:'#/card/'+c.id}));
  return out.filter(x=>!S.done.has(x.k)).sort((a,b)=>a.ord-b.ord);
}
function renewBtns(k,late){ return `${late?'':`<button class="btn sm" data-act="renovar" data-k="${k}">Renovar</button><button class="btn sm" data-act="encerrar" data-k="${k}">Não renovar</button>`}<button class="btn sm" data-act="renegociar" data-k="${k}">Renegociar</button><button class="btn sm ghost" data-act="adiar" data-k="${k}">Adiar 7d</button>`; }
function prazosList(limit=90, who){
  return C.map(c=>({c,d:noticeDeadline(c)})).filter(x=>x.d && (!who||x.c.resp===who)).map(x=>({...x,n:days(x.d)})).filter(x=>x.n<=limit && x.n>=-30).sort((a,b)=>a.n-b.n);
}

// o solicitante vê a esteira simplificada: as 6 etapas viram 4 passos
function stepperRow(r){
  const steps=['Recebido','Em análise','Assinatura','Concluído'];
  const idx = INBOX(r)?0: (r.etapa==='revisao'||r.etapa==='negociacao')?1: r.etapa==='assinatura'?2:3;
  const waiting = r.prog==='Bloqueado'&&/Aguardando/.test(r.bloqueio||'');
  return `<div class="row" style="display:block"><div style="display:flex;gap:8px;align-items:baseline"><div class="t grow">${esc(r.titulo)}</div><span class="mono">${esc(r.id)} · ${esc(r.criado)}</span></div>
  <div class="stepper">${steps.map((s,i)=>`<div class="${i<idx?'done':i===idx?'cur':''}">${s}</div>`).join('')}</div>
  <div class="s">${r.resp?`Com ${esc(r.resp)} no Legal.`:'Na fila do Legal.'} ${waiting?'<b>O Legal precisa de uma resposta sua.</b>':''} ${idx<3?`Previsão: ${slaInfo(r).txt}.`:''} Atualizações chegam no seu Slack.</div></div>`;
}

const BASECOLS=[
  ['Identificação','tipo','Tipo'],['Identificação','contraparte','Contraparte'],['Identificação','area','Área'],['Identificação','resp','Responsável'],
  ['Vigência','assinatura','Assinatura'],['Vigência','vencimento','Vencimento'],['Vigência','renovAuto','Renov. auto'],['Vigência','_d','Aviso (D-)'],
  ['Pagamento','valor','Valor'],['Rescisão','aviso','Aviso prévio'],['Rescisão','multaResc','Multa rescisória'],
  ['Cessão','cessao','Cessão'],['Alteração de controle','controle','Alt. controle'],['Alteração de controle','controleNotif','Notificação'],
  ['Dados','dados','Compart. dados'],['Dados','agente','Agente'],['Análise','risco','Risco'],['Análise','_v','Verificados'],
];
const VIEWS={
  'Todos':[], 'Vencendo em 90 dias':[{k:'_d90',l:'aviso em até 90 dias'}], 'Mudança de controle':[{k:'controle',v:'Sim',l:'alteração de controle: sim'}],
  'Compartilham dados':[{k:'dados',v:'Sim',l:'compartilha dados: sim'}], 'Não verificados':[{k:'_unv',l:'com campos a conferir'}], 'Minhas':[{k:'resp',v:'@me',l:'responsável: eu'}],
};
function applyChips(list,chips){
  return list.filter(c=>chips.every(ch=>{
    if(ch.k==='_d90'){const n=days(noticeDeadline(c));return n<=90;}
    if(ch.k==='_unv') return validCount(c)<SCHEMA.length;
    if(ch.k==='_ano') return (c.vencimento||'').endsWith(ch.v);
    if(ch.k==='resp' && ch.v==='@me') return c.resp===me().name;
    if(ch.k==='_txt') return JSON.stringify(c).toLowerCase().includes(ch.v.toLowerCase());
    return (c[ch.k]||'').toLowerCase().startsWith(ch.v.toLowerCase());
  }));
}
function nlToChips(q){
  const t=q.toLowerCase(); const out=[];
  if(/controle/.test(t)) out.push({k:'controle',v:'Sim',l:'alteração de controle: sim'});
  if(/renova/.test(t)) out.push({k:'renovAuto',v:'Sim',l:'renovação automática: sim'});
  if(/dados|lgpd/.test(t)) out.push({k:'dados',v:'Sim',l:'compartilha dados: sim'});
  if(/cess[ãa]o/.test(t)) out.push({k:'cessao',v:'Não',l:'cessão: só com anuência'});
  const y=/20\d\d/.exec(t); if(y) out.push({k:'_ano',v:y[0],l:'vence em '+y[0]});
  if(/90 dias|vencendo|vence logo|pr[óo]xim/.test(t)) out.push({k:'_d90',l:'aviso em até 90 dias'});
  [['cliente','Cliente'],['fornecedor','Fornecedor'],['parceiro','Parceiro'],['nda','NDA'],['loca','Locação']].forEach(([w,v])=>{ if(t.includes(w)) out.push({k:'tipo',v,l:'tipo: '+v.toLowerCase()}); });
  if(/risco alto|alto risco/.test(t)) out.push({k:'risco',v:'alto',l:'risco: alto'});
  if(/n[ãa]o validad|pendente/.test(t)) out.push({k:'_unv',l:'com campos não validados'});
  if(!out.length && t.trim()) out.push({k:'_txt',v:q.trim(),l:'contém: '+q.trim()});
  return out;
}
// colunas criadas por pergunta ("+ Coluna" / "Transformar em coluna"): rodam no acervo todo
let S_extra = [];
function answerCol(q,c){
  const t=q.toLowerCase();
  if(/foro/.test(t)) return 'São Paulo/SP';
  if(/exclusiv/.test(t)) return c.id==='mercadosul'?'Sim, 12 meses':'Não';
  if(/cap|limita/.test(t)) return {tropico:'Sem cap',kappa:'12 meses de fees',austral:'R$ 2.000.000',lumen:'6 meses de fees'}[c.id]||'Valor do contrato';
  if(/controle/.test(t)) return c.controle==='Sim'?`Sim · ${c.controleNotif}`:'Não';
  if(/dados|lgpd/.test(t)) return c.dados==='Sim'?c.agente:'Não';
  if(/renova/.test(t)) return c.renovAuto;
  return 'a conferir';
}
function addCol(q,tipo){ S_extra.push({k:'_x'+S_extra.length,l:q,tipo}); }
function cellVal(c,k){
  if(k.startsWith('_x')){ const col=S_extra.find(x=>x.k===k); return esc(answerCol(col.l,c)); }
  if(k==='_d'){ const n=days(noticeDeadline(c)); return dBadge(n); }
  if(k==='_v'){ const v=validCount(c); return `<span class="mono" style="color:${v===SCHEMA.length?'var(--ok)':'var(--muted)'}">${v}/${SCHEMA.length}</span>`; }
  if(k==='risco') return riskPill(c.risco);
  return esc(c[k]??'');
}
function renderContratos(){
  const list=applyChips(C,S.chips);

  const canEdit = S.persona==='head'||S.persona==='analista';
  return `<h1>Contratos</h1><p class="sub">A planilha do Legal, viva. Cada valor vem do contrato, e o sublinhado roxo indica o que ainda não foi validado. ${canEdit?'Dê dois cliques numa célula para editar.':'Você tem acesso de leitura.'}</p>

  <div class="toolbar">

    ${canEdit?'<button class="btn" data-act="addcol">+ Coluna</button>':''}

  <div class="tablewrap"><table>
   <thead><tr class="grp"><th class="sticky"></th>${groups.map(g=>`<th colspan="${g.n}">${g.g}</th>`).join('')}</tr>

   <tbody>${list.map(c=>`<tr><td class="sticky"><span class="lnk" data-go="#/card/${c.id}">${esc(c.nome)}</span></td>${PCOLS.map(([,k])=>{
      const isEd=S.editing&&S.editing.id===c.id&&S.editing.k===k;

  </table></div>
  <p class="mono" style="margin-top:10px">Fonte: campos extraídos pela IA · ${C.reduce((a,c)=>a+SCHEMA.length-validCount(c),0)} a conferir</p>`;
}
function exportCSV(){
  const list=applyChips(C,S.chips); const cols=SCHEMA;
  const rows=[['Contrato',...cols.map(f=>f.g+' › '+f.l),'Responsável','Risco',...S_extra.map(x=>x.l)]].concat(list.map(c=>[c.nome,...cols.map(f=>c[f.k]),c.resp,c.risco,...S_extra.map(x=>answerCol(x.l,c))]));
  const csv='﻿'+rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(';')).join('\n');
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'})); a.download='contratos-mike.csv'; a.click();
  toast(`${list.length} contratos exportados no layout da planilha do Legal.`);
}

function risksOf(c){
  const r=[];
  if(c.controle==='Sim'&&/multa|rescis/i.test(c.controlePen)) r.push({lvl:'alto',cl:'7.1',t:`Mudança de controle exige ${c.controleNotif.toLowerCase()}, sob pena de ${c.controlePen.toLowerCase()}.`,sug:'Trocar autorização prévia por notificação em até 30 dias, sem penalidade quando o adquirente for do mesmo grupo econômico.'});
  if(parseInt(c.aviso)>=90&&c.renovAuto==='Sim') r.push({lvl:'medio',cl:'3.2 / 5.1',t:`Renovação automática com aviso longo (${c.aviso}). Se ninguém agir até ${fmt(noticeDeadline(c))}, o contrato renova.`,sug:'Alerta D-90/60/30 já criado para o responsável.'});
  if(/R\$|meses de fees/.test(c.multaResc)) r.push({lvl:'medio',cl:'5.2',t:`Multa rescisória relevante: ${c.multaResc}.`,sug:'Playbook: limitar a 3 mensalidades.'});
  if(c.dados==='Sim'&&/Controlador/.test(c.agente)) r.push({lvl:'medio',cl:'8.1',t:`Contraparte como ${c.agente.toLowerCase()}: exige base legal e DPA próprios.`,sug:'Anexar DPA com sub-processadores e prazo de notificação de incidente de 48h.'});
  r.push({lvl:'fav',cl:'4.2',t:`Encargos de atraso dentro do padrão (${c.multa} + ${c.juros}).`});
  return r;
}
function renderCard(id){

    }).join('');

    side=items.map(i=>`<div class="row">${dBadge(days(i.d))}<div class="grow"><div class="t">${esc(i.t)}</div><div class="s">${fmt(i.d)} · alerta: ${i.alert} · para ${esc(c.resp)}</div></div><span class="pill ${i.crit?'red':'vio'}">${i.crit?'crítico':'recorrente'}</span></div>`).join('')+

  <p class="sub" style="margin-top:-6px">${esc(c.nome)} · assinado em ${esc(c.assinatura)} · aviso até <b>${fmt(noticeDeadline(c))}</b> ${dBadge(days(noticeDeadline(c)))}</p>

function highlight(k){
  const doc=$('#doc'); if(!doc) return;
  doc.querySelectorAll('mark').forEach(m=>{ m.replaceWith(...m.childNodes); });
  const el=doc.querySelector(`[data-q="${k}"]`);
  if(el){ const m=document.createElement('mark'); el.parentNode.insertBefore(m,el); m.appendChild(el); doc.scrollTo({top:m.offsetTop-doc.offsetTop-doc.clientHeight/3,behavior:'smooth'}); }
  else { toast('Campo preenchido pelo Legal, sem cláusula de origem no documento.'); }
}

// ---------- Perguntar ----------
function answer(q){
  const t=q.toLowerCase();
  const src=(c,cl,txt)=>({c,cl,txt});
  let r;
  const named=C.find(c=>t.includes(c.contraparte.split(' ')[0].toLowerCase()));
  if(/controle/.test(t)){ const l=C.filter(c=>c.controle==='Sim'); r={a:`<b>${l.length} contratos</b> têm cláusula de alteração de controle. Os mais sensíveis são Trópico (autorização prévia + multa de R$ 500 mil) e Kappa (rescisão + multa).`,src:l.map(c=>src(c,'7.1',`dependerá de ${c.controleNotif.toLowerCase()}`)),chips:[{k:'controle',v:'Sim',l:'alteração de controle: sim'}]}; }
  else if(/venc|90 dias|renova/.test(t)){ const l=prazosList(90); r={a:`<b>${l.length} contratos</b> têm a data limite do aviso nos próximos 90 dias. O primeiro é ${esc(l[0].c.contraparte)} (${fmt(l[0].d)}).`,src:l.map(x=>src(x.c,'3.1 / 5.1',`encerrando-se em ${x.c.vencimento} · aviso de ${x.c.aviso}`)),chips:[{k:'_d90',l:'aviso em até 90 dias'}]}; }
  else if(/dados|lgpd/.test(t)){ const l=C.filter(c=>c.dados==='Sim'); r={a:`<b>${l.length} contratos</b> envolvem compartilhamento de dados pessoais. Em ${l.filter(c=>/Controlador/.test(c.agente)).length} a contraparte atua como controladora.`,src:l.map(c=>src(c,'8.1',`atuando a Contraparte como ${c.agente.toLowerCase()}`)),chips:[{k:'dados',v:'Sim',l:'compartilha dados: sim'}]}; }
  else if(named){ const c=named; r={a:`Sim. Temos <b>${esc(c.nome)}</b> com ${esc(c.contraparte)}, assinado em ${esc(c.assinatura)}. Vence em <b>${esc(c.vencimento)}</b>${c.renovAuto==='Sim'?' com renovação automática':''}. O aviso prévio é de ${esc(c.aviso)}, então a decisão precisa sair até <b>${fmt(noticeDeadline(c))}</b>. Valor: ${esc(c.valor)}.`,src:[src(c,'3.1',`vigorará pelo prazo de ${c.vigencia}… encerrando-se em ${c.vencimento}`),src(c,'4.1',`será devido o valor de ${c.valor}`)],chips:null}; }
  else r={a:'Não achei isso com citação nos contratos. Sem citação, eu não respondo. Tente reformular ou peça ao Legal pelo <b>Novo pedido</b>.',src:[],chips:null};
  return r;
}

// ---------- router ----------
function render(){
  const [ , route='inicio', arg] = (location.hash||'#/inicio').split('/');
  if(S.persona==='solicitante' && !['inicio','pedidos'].includes(route)) { go('#/inicio'); return; }
  if(S.persona!=='solicitante' && route==='pedidos') { go('#/esteira'); return; }
  renderNav(route);
  const app=$('#app');
  app.innerHTML = route==='pedidos'||route==='esteira'?renderEsteira(): route==='contratos'?renderContratos(): route==='card'?renderCard(arg): route==='prazos'?renderPrazos(): renderInicio();
  const inp=app.querySelector('[data-editcell],[data-editfield]'); if(inp){ inp.focus(); inp.select(); }
  if(route==='card' && S.selField) highlight(S.selField);
}

// ---------- eventos ----------
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act],[data-go],[data-view],[data-rmchip],[data-filter],[data-eview],[data-etapa],[data-cptab],[data-field],[data-validate],[data-flag],[data-editf],[data-scope],[data-ascol],[data-ask],[data-gosrc],[data-astable],[data-asexport],[data-gocl],[data-close]');
  if(!t) return;
  const d=t.dataset;
  if(d.close!==undefined){ close(); return; }
  if(d.act){ e.stopPropagation(); return act(d.act,t); }
  if(d.validate){ e.stopPropagation(); const c=curC(); c.prov[d.validate]={s:'ok',by:me().name,at:'20/10'}; c.activity.push({t:'ev',who:me().name,txt:`verificou "${SCHEMA.find(f=>f.k===d.validate).l}"`,at:'20/10 agora'}); render(); return; }
  if(d.flag){ e.stopPropagation(); const c=curC(); c.prov[d.flag]={s:'flag',by:me().name,at:'20/10'}; c.activity.push({t:'cm',who:me().name,txt:`sinalizou "${SCHEMA.find(f=>f.k===d.flag).l}": @Fernanda confere este valor?`,at:'20/10 agora'}); toast('Campo sinalizado. Fica fora do "verificado" até alguém resolver.'); render(); return; }
  if(d.editf){ e.stopPropagation(); S.editing={id:curC().id,k:d.editf}; render(); return; }
  if(d.field){ if(e.target.tagName==='INPUT') return; S.selField=d.field; render(); return; }
  if(d.view){ S.view=d.view; S.chips=[...VIEWS[d.view]]; S.q=''; render(); return; }
  if(d.rmchip){ S.chips.splice(+d.rmchip,1); render(); return; }
  if(d.filter){ S.inboxFilter=d.filter; render(); return; }
  if(d.eview){ S.esteiraView=d.eview; render(); return; }
  if(d.etapa){ const r=curCard(); moveEtapa(r,d.etapa); return; }
  if(d.scope){ S.scope=d.scope; renderAsk(); return; }
  if(d.ascol){ const x=S.asks[+d.ascol]; addCol(x.q,'texto'); close(); S.chips=[]; S.view='Todos'; go('#/contratos'); render(); toast('Coluna criada. A IA respondeu para cada contrato; as células ficam "a conferir".'); return; }
  if(d.cptab){ S.cpTab=d.cptab; S.editing=null; render(); return; }
  if(d.ask){ ask(d.ask); return; }
  if(d.gosrc){ const [id,cl]=d.gosrc.split('|'); close(); S.cpTab='Ficha'; const f=SCHEMA.find(f=>f.cl===cl); S.selField=f?f.k:null; go('#/card/'+id); return; }
  if(d.gocl){ const f=SCHEMA.find(f=>f.cl===d.gocl); S.cpTab='Ficha'; S.selField=f?f.k:null; render(); return; }
  if(d.astable){ const x=S.asks[+d.astable]; S.chips=[...x.r.chips]; S.view=''; close(); go('#/contratos'); render(); return; }
  if(d.asexport){ const x=S.asks[+d.asexport]; S.chips=[...x.r.chips]; exportCSV(); return; }
  if(d.go){ if(e.target.closest('button,select,input')&&!t.matches('button')) return; go(d.go); return; }
});

document.addEventListener('keydown',e=>{

  if(a==='encerrar'||a==='renegociar'){ const c=C.find(x=>'renov-'+x.id===d.k); confirmAct(a==='encerrar'?'Não renovar · '+c.contraparte:'Renegociar · '+c.contraparte,[a==='encerrar'?`Gerar a minuta de notificação de não renovação (aviso de ${esc(c.aviso)}, cl. 5.1) para ${esc(c.resp)} revisar`:`Abrir um card na Entrada da esteira ligado a este contrato, com ${esc(c.resp)} como responsável`,'Registrar a decisão na atividade do contrato','Avisar a área responsável ('+esc(c.area)+') no Slack'],()=>{ S.done.add(d.k); if(a==='renegociar'){ R.unshift({id:'LEG-0'+(130+R.length),titulo:'Renegociação · '+c.contraparte.split(' ')[0],tipo:c.tipo,contraparte:c.contraparte,sol:me().name,areaSol:'Legal',canal:'Prazos',criado:'20/10 agora',slaH:120,usadoH:0,resp:c.resp,etapa:'entrada',prog:'A fazer',prio:'Alta',prazo:'',ctx:'Renegociar antes da renovação.',contractId:c.id,triagem:{tipo:'Renegociação',risco:c.risco,playbook:'—',nota:'Aberto a partir do alerta de renovação.'},thread:[],activity:[{t:'ev',who:me().name,txt:'abriu a partir do alerta de renovação',at:'20/10 agora'}]}); } toast(a==='encerrar'?'Minuta de não renovação gerada para revisão.':'Card de renegociação criado na Entrada.'); render(); }); return; }

  if(a==='assumir'){ const r=R.find(x=>x.id===d.r); r.resp=me().name; if(r.etapa==='entrada') r.etapa='triagem'; r.prog='Em andamento'; r.activity.push({t:'ev',who:me().name,txt:'assumiu o card',at:'20/10 agora'}); toast('Card é seu e foi para a Triagem. '+r.sol+' foi avisado no Slack.'); render(); return; }

  if(a==='aprovar'){ const r=R.find(x=>x.id===d.r); confirmAct('Aprovar NDA padrão',[`Gerar o NDA padrão Avenia v3 com os dados de ${esc(r.contraparte)}`,`Enviar a minuta para ${esc(r.sol)} na thread do Slack`,'Mover o card para Assinatura'],()=>{ r.resp=r.resp||me().name; r.etapa='assinatura'; r.prog='Em andamento'; r.activity.push({t:'ev',who:me().name,txt:'aprovou o NDA padrão e moveu para Assinatura',at:'20/10 agora'}); toast('NDA aprovado. Minuta enviada para '+r.sol+'.'); render(); }); return; }

  if(a==='notion'){ toast('No produto, abre o card no board "Pipeline · Mike" do Notion.'); return; }

  if(a==='export'){ exportCSV(); return; }
  if(a==='clearchips'){ S.chips=[]; S.q=''; S.view='Todos'; render(); return; }
  if(a==='saveview'){ const n='Minha visão '+(Object.keys(VIEWS).length-5); VIEWS[n]=[...S.chips]; S.view=n; toast('Visão salva: '+n); render(); return; }
  if(a==='validall'){ const c=C.find(x=>x.id===d.c); let n=0; SCHEMA.forEach(f=>{ if(c.prov[f.k].s==='ia'){ c.prov[f.k]={s:'ok',by:me().name,at:'20/10'}; n++; } }); c.activity.push({t:'ev',who:me().name,txt:`verificou ${n} campos em lote`,at:'20/10 agora'}); toast(n+' campos verificados.'); render(); return; }
  if(a==='share'){ const m=$('#modal'); m.innerHTML=`<div class="card-h"><h2 style="font-size:18px">Compartilhar contrato</h2><button class="btn ghost" data-close>✕</button></div><label class="mono">Pessoa</label><input class="in" placeholder="nome@avenia.io"><label class="mono">Pode</label><div class="opt"><button class="on">ver</button><button>comentar</button><button>editar</button></div><label style="display:flex;gap:8px;align-items:center;margin-bottom:14px"><input type="checkbox"> Confidencial: só o Admin Legal e as pessoas listadas veem (inclusive no Perguntar)</label><div class="mono">Quem tem acesso</div>${['Fernanda · Admin Legal','Duda · Legal (responsável)','Téo · Legal','Bruno · Leitor'].map(x=>`<div class="row">${x}</div>`).join('')}<div class="toolbar"><div class="spacer"></div><button class="btn pri" data-close>Pronto</button></div>`; open('modal'); m.querySelector('.opt').onclick=e=>{ if(e.target.tagName==='BUTTON') m.querySelectorAll('.opt button').forEach(b=>b.classList.toggle('on',b===e.target)); }; return; }

  if(a==='alerta'){ toast('Alerta criado: você é avisado quando um contrato novo entrar nesse filtro.'); return; }

function planOf(r){

  <div class="rt"><div class="rt-in" style="min-width:720px"><div class="rt-row rt-head" style="grid-template-columns:minmax(220px,2fr) 150px 140px minmax(200px,2fr) 90px"><div>Espaço</div><div>Tipo</div><div>Pessoas</div><div>O que vê</div><div>Cards</div></div>
  ${SPACES.map((s,i)=>`<div class="rt-row ${S.dp&&S.dp.id===s.id?'sel':''} ${S.foc===i?'foc':''}" style="grid-template-columns:minmax(220px,2fr) 150px 140px minmax(200px,2fr) 90px" data-x="row" data-kind="space" data-id="${s.id}" data-i="${i}"><div class="t">${esc(s.nome)}</div><div>${s.ext?'<span class="pill amb">Externo</span>':`<span class="s" style="color:var(--ink-soft)">${esc(s.tipo)}</span>`}</div><div style="display:flex;gap:2px">${s.membros.map(m=>avatar(m)).join('')}</div><div class="s">${esc(s.ve)}</div><div class="mono" style="text-transform:none">${s.cards.length||'—'}</div></div>`).join('')}</div></div>
  <p class="proto-note">no código: organizations + workspaces + grants do upstream; convidado externo = grant por card</p>`;
}
function dpSpace(s){
  return `${s.ext?'<span class="pill amb">Externo</span> ':''}<span class="muted">${esc(s.tipo)}</span><div class="dp-t">${esc(s.nome)}</div>
  <dl class="kv"><dt>Vê</dt><dd>${esc(s.ve)}</dd>${s.perm?`<dt>Pode</dt><dd>${s.perm}</dd>`:''}</dl>
  <div class="dp-sec">Pessoas <span>${s.membros.length}</span></div>${s.membros.map(m=>`<div class="row">${avatar(m)}<div class="grow">${esc(m)}</div>${s.ext?'<span class="pill amb">Externo</span>':''}</div>`).join('')}
  <div class="dp-sec">Cards compartilhados <span>${s.cards.length}</span></div>
  ${s.cards.length?s.cards.map(id=>{const r=R.find(x=>x.id===id);return `<div class="row clickable" data-x="gocard" data-id="${id}"><span class="mono" style="text-transform:none">${id}</span><div class="grow"><div class="t">${esc(r.titulo)}</div><div class="s">${LANE[r.etapa]}</div></div></div>`;}).join('')
   :emptyState('Nada compartilhado ainda.','Compartilhe um contrato ou pedido: só ele fica visível para quem está neste espaço.','<button class="btn pri" data-act="share">Compartilhar um card</button>')}
  <div class="toolbar" style="margin-top:12px"><button class="btn" data-x="invite" data-id="${s.id}">Convidar pessoa</button></div>`;
}

// ---------- Painel do Legal ----------
function renderPainel(){
  const ver=Math.round(C.reduce((a,c)=>a+validCount(c),0)/(C.length*SCHEMA.length)*100);
  const areas=[['Comercial',9],['Tecnologia',4],['Financeiro',4],['Compliance',3],['Produto',2],['Marketing',1]];
  return `<h1>Painel do Legal</h1><p class="sub">Outubro de 2026 · 4 números que a Head usa, com a conta à vista.</p>
  ${statTiles([{k:'t',n:'1,6 d',l:'Tempo médio Entrada → Revisão',static:true},{k:'v',n:ver+'%',l:'Campos da Ficha verificados',static:true},{k:'p',n:'23',l:'Pedidos no mês',static:true},{k:'h',n:'≈ 32 h',l:'Horas poupadas no mês',static:true}])}
  <p class="muted" style="font-size:12.5px;margin:-6px 0 16px">Horas poupadas = 23 primeiras revisões × 1,8 h (1ª leitura manual medida em setembro) − 23 × 0,4 h de conferência humana. Ajuste os fatores em Configurações.</p>
  <div class="grid g-home"><section class="card"><div class="card-h"><h2>Pedidos por área</h2></div>${areas.map(([a,n])=>`<div class="row"><div style="width:110px">${a}</div><div class="hbar"><i style="width:${n/9*100}%"></i></div><span class="mono">${n}</span></div>`).join('')}</section>
  <section class="card"><div class="card-h"><h2>O que os agentes fizeram</h2><span class="mono">decisão humana</span></div>
   ${[['revisao',61,72,18,10],['extracao',288,81,15,4],['atribuicao',19,84,11,5],['regulatorio',7,57,0,43]].map(([k,n,a,e,r])=>`<div class="row">${avatar('ag:'+k)}<div class="grow"><div class="t">${AG[k]}</div><div class="s">${n} sugestões · ${a}% aceitas · ${e}% editadas · ${r}% rejeitadas</div></div></div>`).join('')}
  </section></div>`;
}

// ---------- DetailPanel ----------
function renderDP(route){
  const host=$('#dp');
  if(!S.dp||S.dp.route!==route){ host.innerHTML=''; document.body.classList.remove('dp-open'); return; }
  const k=S.dp.kind, id=S.dp.id;
  const body = k==='rev'?dpRev(REV.find(r=>r.id===id)) : k==='folders'?dpFolders() : k==='ped'?dpPed(R.find(r=>r.id===id)) : k==='space'?dpSpace(SPACES.find(s=>s.id===id)) : '';
  host.innerHTML=`<aside class="dp" role="dialog" aria-label="Detalhes"><div class="dp-h"><span class="mono">${{rev:'revisão',folders:'pastas',ped:'pedido',space:'espaço'}[k]}</span><div class="spacer"></div><button class="btn ghost sm" data-x="dpclose" aria-label="Fechar (Esc)">${ico('x',14)}</button></div><div class="dp-b">${body}</div></aside>`;
  document.body.classList.add('dp-open');
}

// ---------- router ----------
function render(){
  const [ , route='inicio', arg] = (location.hash||'#/inicio').split('/');
  if(S.persona==='solicitante' && !['inicio','pedidos'].includes(route)) { go('#/inicio'); return; }
  if(S.persona==='founder' && ['pedidos','esteira','spaces'].includes(route)) { go('#/inicio'); return; }
  if(S.lastRoute!==route){ $('#toast2')?.classList.remove('on'); S.foc=-1; S.sgFoc=0; S.vf=null; S.editingF=null; S.rejecting=null; } S.lastRoute=route;
  renderNav(route);
  const app=$('#app');
  const V={inicio:renderInicio,pedidos:()=>S.persona==='solicitante'?renderEsteira():renderPedidos(),esteira:renderEsteira,contratos:renderContratos,card:()=>renderCard(arg),prazos:renderPrazos,revisao:()=>renderRevisao(arg),'radar-regulatorio':renderRadarReg,spaces:renderSpaces,painel:renderPainel};
  app.innerHTML=(V[route]||renderInicio)();
  const inp=app.querySelector('[data-editcell],[data-editfield]'); if(inp){ inp.focus(); inp.select(); }
  if(route==='card' && S.selField) highlight(S.selField);
  renderDP(route);
  const ri=$('#rejIn'); if(ri) ri.focus(); const st=$('#sgTxt'); if(st) st.focus();
}
const routeNow=()=>(location.hash||'#/inicio').split('/')[1]||'inicio';
function openDP(kind,id){ S.dp={route:routeNow(),kind,id}; render(); }

// ---------- eventos (bloco novo) ----------
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-x]'); if(!t) return; const d=t.dataset; const x=d.x;
  if(t.tagName==='A'&&x==='soon') e.preventDefault();
  if(x==='row'){ if(e.target.closest('select')) return; S.foc=+d.i||S.foc; return openDP(d.kind,d.id); }
  if(x==='dpclose'){ S.dp=null; render(); return; }
  if(x==='tile'){ if(d.k==='pastas') return openDP('folders','f'); if(routeNow()==='pedidos'){ S.pedFilter=S.pedFilter===d.k?null:d.k; } else { S.revFilter=S.revFilter===d.k?null:d.k; } render(); return; }
  if(x==='clearf'){ S.revFilter=null; S.pedFilter=null; render(); return; }
  if(x==='revtab'){ S.revTab=d.t; S.revFilter=null; render(); return; }
  if(x==='greet'){ S.greetOpen=!S.greetOpen; render(); return; }
  if(x==='steps'){ S.openSteps=S.openSteps===d.e?null:d.e; render(); return; }
  if(x==='goped'){ S.dp={route:'pedidos',kind:'ped',id:d.id}; go('#/pedidos'); return; }
  if(x==='gocard'){ S.dp=null; go('#/card/'+d.id); return; }
  if(x==='cite'){ const [k,v]=d.t.split('|'); if(k==='rcl'){ const r=curRev(); const i=sortedFindings(r).findIndex(f=>f.cl===v); if(i>=0) S.sgFoc=i; render(); scrollToCl(v); return; } if(k==='polaris'){ const i=sortedFindings(REV[0]).findIndex(f=>f.cl===v); S.sgFoc=Math.max(0,i); S.dp=null; go('#/revisao/polaris'); setTimeout(()=>scrollToCl(v),60); return; } if(k==='card'){ S.dp=null; go('#/card/'+v); return; } if(k==='pb'){ toast('No produto, abre a regra "'+v+'" no Playbook.'); return; } toast('No produto, abre a publicação oficial: '+v); return; }
  if(x==='assign'){ const r=REV.find(y=>y.id===d.id); r.resp=d.who; r.feed.unshift(ev(me().name,`confirmou a sugestão: ${esc(d.who)} é responsável`,'agora')); render(); undoToast(`${d.who} é responsável pela revisão.`,()=>{ r.resp=null; r.feed.shift(); }); return; }
  if(x==='assignno'){ const r=REV.find(y=>y.id===d.id); const s=r.sugg; r.sugg=null; r.feed.unshift(ev(me().name,'rejeitou a sugestão de responsável','agora')); render(); undoToast('Sugestão rejeitada. Escolha alguém no campo Responsável.',()=>{ r.sugg=s; r.feed.shift(); }); return; }
  if(x==='passign'||x==='passignno'){ const r=R.find(y=>y.id===d.id); if(x==='passign'){ r.resp=d.who; r.activity.push({t:'ev',who:me().name,txt:`aceitou a sugestão do agente de atribuição: ${d.who}`,at:'agora'}); planOf(r).steps.forEach(s=>{ if(!isAg(s.w)) s.w=d.who; }); render(); undoToast(`${d.who} é responsável por ${r.id}. ${r.sol} foi avisado no Slack.`,()=>{ r.resp=null; r.activity.pop(); }); } else { const s=r.sugg; r.sugg=null; render(); undoToast('Sugestão rejeitada.',()=>{ r.sugg=s; }); } return; }
  if(x==='planopen'){ S.planOpen=S.planOpen===d.id?null:d.id; render(); return; }
  if(x==='planrun'){ const r=R.find(y=>y.id===d.id); const p=planOf(r); p.state='rodando'; const s1=p.steps[1]; s1.st='rodando'; s1.lbl='Lendo o contrato…'; r.activity.push({t:'ev',who:me().name,txt:'mandou rodar o plano (4 passos)',at:'agora'}); render(); toast('Plano rodando. Os passos de agente andam sozinhos; os seus esperam você.');
    setTimeout(()=>{ s1.lbl='Conferindo citações…'; render(); },1600);
    setTimeout(()=>{ s1.st='concluido'; s1.lbl=null; p.steps[2].st='em_andamento'; r.activity.push({t:'ev',who:'ag:revisao',txt:'revisou contra o playbook: 2 divergem, 3 para revisar',at:'agora'}); if(r.etapa==='entrada'){ r.etapa='triagem'; r.prog='Em andamento'; } render(); toast('Revisão pronta: 2 divergem, 3 para revisar.'); },3400); return; }
  if(x==='vfilter'){ S.vf=S.vf===d.v?null:d.v; S.sgFoc=0; render(); return; }
  if(x==='revside'){ S.revSide=d.t; render(); return; }
  if(x==='sgfoc'){ if(e.target.closest('button,textarea,input,select')) return; S.sgFoc=+d.i; const f=sortedFindings(curRev())[S.sgFoc]; render(); f&&scrollToCl(f.cl); return; }
  if(x==='sgacc'){ const f=findF(d.f); decide(f,f.neu?'aceito':'conferido'); return; }
  if(x==='sgedit'){ S.editingF=d.f; S.rejecting=null; render(); return; }
  if(x==='sgsave'){ const f=findF(d.f); decide(f,'editado',{txt:$('#sgTxt').value}); return; }
  if(x==='sgrej'){ S.rejecting=d.f; S.editingF=null; render(); return; }
  if(x==='sgrejok'){ const f=findF(d.f); decide(f,'rejeitado',{why:($('#rejIn')||{}).value||''}); return; }
  if(x==='sgcancel'){ S.editingF=null; S.rejecting=null; render(); return; }
  if(x==='sgreopen'){ const f=findF(d.f); f.state=null; render(); return; }
  if(x==='bulka'){ const r=curRev(); const l=r.findings.filter(f=>f.k==='a'&&!f.state); l.forEach(f=>Object.assign(f,{state:'conferido',by:me().name,at:'agora'})); const e2=ev(me().name,`conferiu ${l.length} cláusulas alinhadas em lote`,'agora'); r.feed.unshift(e2); render(); undoToast(`${l.length} cláusulas alinhadas conferidas.`,()=>{ l.forEach(f=>f.state=null); r.feed.shift(); }); return; }
  if(x==='export'){ const r=curRev(); const n=r.findings.filter(f=>f.state==='aceito'||f.state==='editado').length; toast(`No produto: baixa o .docx com ${n} alteraç${n===1?'ão controlada':'ões controladas'} e um comentário por cláusula.`); return; }
  if(x==='scan'){ S.scan=d.id; render(); return; }
  if(x==='regped'){ const ch=SCANS.flatMap(s=>s.changes).find(c=>c.id===d.id); const id='LEG-0'+(129+R.length-7); const c=C.find(y=>y.id===ch.af[0]); R.unshift({id,titulo:'Regulatório · '+ch.t.split(':')[0],tipo:'Parecer',contraparte:c?c.contraparte:'—',sol:me().name,areaSol:'Legal',canal:'Radar regulatório',criado:'20/10 agora',slaH:72,usadoH:0,resp:null,sugg:c?c.resp:'Duda',why:'responsável pelo contrato afetado.',etapa:'entrada',prog:'A fazer',prio:ch.k==='d'?'Alta':'Média',prazo:'',ctx:ch.res+' '+ch.why,contractId:c&&c.id,triagem:{tipo:'Adequação regulatória',risco:ch.k==='d'?'alto':'médio',playbook:'—',nota:ch.fonte},thread:[],activity:[{t:'ev',who:'ag:regulatorio',txt:'abriu a partir do Radar regulatório: '+ch.fonte,at:'20/10 agora'}]}); ch.ped=id; render(); undoToast(`Pedido ${id} criado em Pedidos, ligado a ${ch.af.length} contrato(s).`,()=>{ R.shift(); ch.ped=null; }); return; }
  if(x==='regpb'){ toast('Regra sugerida no playbook. A Fernanda aprova antes de valer para as próximas revisões.'); return; }
  if(x==='regarq'){ const ch=SCANS.flatMap(s=>s.changes).find(c=>c.id===d.id); ch.arq=true; render(); undoToast('Mudança arquivada.',()=>{ ch.arq=false; }); return; }
  if(x==='invite'){ const s=SPACES.find(y=>y.id===d.id); confirmAct('Convidar para '+s.nome,[`Enviar convite por e-mail para a pessoa que você indicar${s.ext?' (fora da Avenia)':''}`,`Ela vê: ${s.ve.toLowerCase()}`,'Registrar o convite na atividade do espaço'],()=>toast('Convite enviado.')); return; }
  if(x==='soon'){ toast(`${d.l}: fica em Mais ▾ no produto, sem mudança nesta rodada.`); return; }
});
document.addEventListener('change',e=>{
  const t=e.target; const x=t.dataset.x2; if(!x) return;
  if(x==='resp'){ const r=REV.find(y=>y.id===t.dataset.id); const old=r.resp; r.resp=t.value||null; r.feed.unshift(ev(me().name,`mudou o responsável para ${esc(t.value||'ninguém')}`,'agora')); render(); undoToast('Responsável atualizado. Espelhado no Notion.',()=>{ r.resp=old; r.feed.shift(); }); }
  if(x==='stepowner'){ const r=R.find(y=>y.id===t.dataset.id); const s=planOf(r).steps[+t.dataset.i]; const old=s.w; s.w=t.value; r.activity.push({t:'ev',who:me().name,txt:`trocou o dono do passo ${+t.dataset.i+1} para ${wName(t.value)} (os outros passos seguem)`,at:'agora'}); render(); undoToast(`Passo ${+t.dataset.i+1} agora é de ${wName(t.value)}. Nada foi reiniciado.`,()=>{ s.w=old; r.activity.pop(); }); }
  if(x==='passignother'&&t.value){ const r=R.find(y=>y.id===t.dataset.id); r.resp=t.value; r.activity.push({t:'ev',who:me().name,txt:`atribuiu a ${t.value} (sugestão editada)`,at:'agora'}); render(); undoToast(`${t.value} é responsável por ${r.id}.`,()=>{ r.resp=null; r.activity.pop(); }); }
  if(x==='ver'&&t.selectedIndex===1) toast('No produto, mostra a minuta original da contraparte, sem as edições.');
});
document.addEventListener('keydown',e=>{
  if(e.target.id==='rejIn'){ if(e.key==='Enter'){ e.preventDefault(); decide(findF(e.target.dataset.f),'rejeitado',{why:e.target.value}); } if(e.key==='Escape'){ S.rejecting=null; render(); } return; }
  if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.metaKey||e.ctrlKey||e.altKey) return;
  const route=routeNow();
  if(S.gPending){ S.gPending=false; const m={i:'inicio',p:'pedidos',e:'esteira',c:'contratos',z:'prazos',r:'radar-regulatorio'}; if(m[e.key]){ e.preventDefault(); go('#/'+m[e.key]); } return; }
  if(e.key==='g'){ S.gPending=true; setTimeout(()=>S.gPending=false,1200); return; }
  if(e.key==='Escape'&&S.dp){ S.dp=null; render(); return; }
  if(route==='revisao'){ const r=curRev(); if(!r) return; const fs=sortedFindings(r); const f=fs[S.sgFoc];
    if(e.key==='j'||e.key==='k'){ S.sgFoc=Math.max(0,Math.min(fs.length-1,S.sgFoc+(e.key==='j'?1:-1))); render(); const g=sortedFindings(r)[S.sgFoc]; g&&scrollToCl(g.cl); document.querySelector('.sg.foc')?.scrollIntoView({block:'nearest'}); return; }
    if(!f||f.state) return;
    if(e.key==='a'){ decide(f,f.neu?'aceito':'conferido'); return; }
    if(e.key==='e'&&f.neu){ e.preventDefault(); S.editingF=f.id; render(); return; }
    if(e.key==='r'){ e.preventDefault(); S.rejecting=f.id; render(); return; }
    return; }
  const rows=[...document.querySelectorAll('.rt-row[data-x="row"]')]; if(!rows.length) return;
  if(e.key==='j'||e.key==='k'){ S.foc=Math.max(0,Math.min(rows.length-1,(S.foc<0?-1:S.foc)+(e.key==='j'?1:-1))); render(); document.querySelector('.rt-row.foc')?.scrollIntoView({block:'nearest'}); return; }
  if(e.key==='Enter'&&S.foc>=0&&rows[S.foc]){ const d=rows[S.foc].dataset; openDP(d.kind,d.id); return; }
  if(S.dp&&(e.key==='a'||e.key==='r')){ const btn=document.querySelector(`.dp [data-x="${{rev:e.key==='a'?'assign':'assignno',ped:e.key==='a'?'passign':'passignno'}[S.dp.kind]}"]`); if(btn){ btn.click(); } }
});
render();
</script>
